services:
  # --- Сервис базы данных PostgreSQL ---
  alfa_db:
    image: postgres:16-alpine
    container_name: alfa_postgres_db
    restart: always
    environment:
      POSTGRES_USER: alfa_user
      POSTGRES_PASSWORD: alfa_password
      POSTGRES_DB: alfa_insights_db
    ports:
      - "5432:5432"
    # ТЕПЕРЬ ДАННЫЕ БУДУТ ХРАНИТЬСЯ В ПАПКЕ backend/postgres_data
    volumes:
      - ./backend/postgres_data:/var/lib/postgresql/data
    # Исправленная команда конфигурации без синтаксических ошибок
    command: postgres -c max_connections=100 -c shared_buffers=256MB
